name: AICTE FDR Portal CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Run Unit & Integration Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn pydantic python-multipart pillow

      - name: Execute Microservice Integration Tests
        run: |
          python -m pytest tests/test_services.py -v

  docker-build-and-scan:
    name: Build Multi-Service Docker Images & Security Scan
    runs-on: ubuntu-latest
    needs: test-and-lint
    strategy:
      matrix:
        service:
          - fdr-service
          - bank-gateway
          - ocr-service
          - audit-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          push: false
          tags: aicte-registry.nic.in/fdr-portal/${{ matrix.service }}:${{ github.sha }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aicte-registry.nic.in/fdr-portal/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  k8s-manifest-validation:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Validate Production Stack Manifest
        run: |
          kubectl apply --dry-run=client -f deploy/k8s/production-stack.yaml
