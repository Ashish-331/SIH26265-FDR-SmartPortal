global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fdr-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fdr-service:8000"]
        labels:
          service: "fdr-core"
          environment: "production"

  - job_name: "bank-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["bank-gateway:8001"]
        labels:
          service: "bank-cbs-adapter"
          environment: "production"

  - job_name: "ocr-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ocr-service:8002"]
        labels:
          service: "ocr-fraud-engine"
          environment: "production"

  - job_name: "audit-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["audit-service:8003"]
        labels:
          service: "audit-merkle-ledger"
          environment: "production"
